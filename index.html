<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>모두의 EDUFLIX 1th</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background-color: #141414;
      color: white;
      text-align: center;
    }
    h1 {
      color: #e50914;
      font-size: 2.5em;
      margin-top: 20px;
    }
    h2 {
      font-size: 1.2em;
      margin-bottom: 6px;
    }
    .subtitle {
      font-size: 1.1em;
      color: white;
      font-weight: bold;
      margin: 4px;
    }
    .copyright {
      font-size: 0.9em;
      color: #999;
      margin-bottom: 20px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 30px;
      padding: 20px;
      max-width: 1200px;
      margin: auto;
    }
    .card {
      background-color: #222;
      padding: 10px;
      border-radius: 10px;
      position: relative;
      transition: transform 0.2s;
    }
    .card:hover {
      transform: scale(1.03);
    }
    .card img {
      width: 100%;
      border-radius: 5px;
      object-fit: contain;
    }
    .top11 {
      position: absolute;
      top: 8px;
      right: 8px;
      background-color: red;
      color: white;
      font-size: 0.75em;
      padding: 2px 8px;
      border-radius: 5px;
      font-weight: bold;
    }
    .card-buttons {
      margin-top: 10px;
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .btn {
      font-size: 0.75em;
      padding: 6px 10px;
      border: none;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-season {
      background-color: red;
      color: white;
    }
    .btn-watch {
      background-color: white;
      color: black;
    }
    a {
      color: inherit;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <h1>모두의 EDUFLIX 1th</h1>
  <div class="subtitle">에듀플릭스 오리지널</div>
  <div class="copyright">Copyright © All Teachers</div>

  <div class="grid">
    <!-- 예시 카드 시작 -->
    <div class="card">
      <a href="https://course-advisor-p3412.replit.app/" target="_blank">
        <img src="images/thumb_2022_과목상담기.png" alt="과목상담기" />
        <div class="top11">TOP11</div>
      </a>
      <h2>2022 과목상담기</h2>
      <div class="card-buttons">
        <div class="btn btn-season">지난 시즌</div>
        <a href="https://course-advisor-p3412.replit.app/" target="_blank">
          <div class="btn btn-watch">지금 시청하기</div>
        </a>
      </div>
    </div>

    <!-- 다른 카드들 복붙해서 수정 -->
    <div class="card">
      <a href="https://park-sanggeun.github.io/curriculum-2025/">
        <img src="images/thumb_2025_교과전형_배치표.png" alt="배치표" />
        <div class="top11">TOP11</div>
      </a>
      <h2>2025 교과전형 배치표</h2>
      <div class="card-buttons">
        <div class="btn btn-season">지난 시즌</div>
        <a href="https://park-sanggeun.github.io/curriculum-2025/">
          <div class="btn btn-watch">지금 시청하기</div>
        </a>
      </div>
    </div>

    <!-- 계속 추가 가능 -->
  </div>
</body>
</html>
