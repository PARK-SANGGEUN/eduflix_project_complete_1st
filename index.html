
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>모두의 EDUFLIX</title>
  <style>
    body {
      margin: 0;
      background-color: #141414;
      font-family: 'Noto Sans KR', sans-serif;
      color: white;
    }
    header {
      padding: 2rem 1rem;
      text-align: center;
      background-color: #000;
    }
    header h1 {
      font-size: 2.5rem;
      color: #E50914;
      margin: 0;
    }
    header p {
      font-size: 1rem;
      color: #aaa;
    }
    .section {
      padding: 1rem 2%;
    }
    .section h2 {
      color: white;
      border-left: 5px solid #E50914;
      padding-left: 0.5rem;
      font-size: 1.4rem;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1rem;
      margin-top: 1rem;
    }
    .card {
      background-color: #222;
      border-radius: 8px;
      overflow: hidden;
      transition: transform 0.2s;
    }
    .card:hover {
      transform: scale(1.03);
    }
    .card img {
      width: 100%;
      height: auto;
      display: block;
    }
    .card-title {
      padding: 1rem;
      font-size: 0.95rem;
      color: #fff;
    }
    @media (max-width: 480px) {
      header h1 {
        font-size: 2rem;
      }
      .section h2 {
        font-size: 1.2rem;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>모두의 EDUFLIX</h1>
    <p>진학오리지널스 – 진학자료를 넷플릭스처럼 쉽게</p>
  </header>

  <div class="section">
    <h2>🎓 진학 자료 라이브러리</h2>
    <div class="grid">

      <a class="card" href="#" target="_blank">
        <img src="images/thumb_2022_과목상담기.png" alt="2022 과목상담기">
        <div class="card-title">2022 과목상담기</div>
      </a>
    
      <a class="card" href="#" target="_blank">
        <img src="images/thumb_2025_교과전형_배치표.png" alt="2025 교과전형 배치표">
        <div class="card-title">2025 교과전형 배치표</div>
      </a>
    
      <a class="card" href="#" target="_blank">
        <img src="images/thumb_2026_고등학교_학부모안내서.png" alt="2026 고등학교 학부모안내서">
        <div class="card-title">2026 고등학교 학부모안내서</div>
      </a>
    
      <a class="card" href="#" target="_blank">
        <img src="images/thumb_2026_중학교_학부모안내서.png" alt="2026 중학교 학부모안내서">
        <div class="card-title">2026 중학교 학부모안내서</div>
      </a>
    
      <a class="card" href="#" target="_blank">
        <img src="images/thumb_2027_대입전형변경.png" alt="2027 대입전형변경">
        <div class="card-title">2027 대입전형변경</div>
      </a>
    
      <a class="card" href="#" target="_blank">
        <img src="images/thumb_2027_대입정보119.png" alt="2027 대입정보119">
        <div class="card-title">2027 대입정보119</div>
      </a>
    
      <a class="card" href="#" target="_blank">
        <img src="images/thumb_2028_반영과목_권장과목.png" alt="2028 반영과목 권장과목">
        <div class="card-title">2028 반영과목 권장과목</div>
      </a>
    
      <a class="card" href="#" target="_blank">
        <img src="images/thumb_수시3개년_TOWER.png" alt="수시3개년 TOWER">
        <div class="card-title">수시3개년 TOWER</div>
      </a>
    
      <a class="card" href="#" target="_blank">
        <img src="images/thumb_시너지밴드_서재.png" alt="시너지밴드 서재">
        <div class="card-title">시너지밴드 서재</div>
      </a>
    
      <a class="card" href="#" target="_blank">
        <img src="images/thumb_탐구참고자료.png" alt="탐구참고자료">
        <div class="card-title">탐구참고자료</div>
      </a>
    
      <a class="card" href="#" target="_blank">
        <img src="images/thumb_학부모_QnA100.png" alt="학부모 QnA100">
        <div class="card-title">학부모 QnA100</div>
      </a>
    
    </div>
  </div>
</body>
</html>
